name: Ideia de pauta
description: Sugerir um assunto para um post
labels: ["pauta"]

body:
  - type: markdown
    attributes:
      value: |
        Sugestões são bem-vindas. Só não prometo prazo, porque escrevo no tempo livre.

  - type: textarea
    id: assunto
    attributes:
      label: O assunto
      description: Sobre o que seria o post e por que vale a pena escrever sobre isso.
    validations:
      required: true

  - type: textarea
    id: referencias
    attributes:
      label: Referências
      description: Links, papers ou leituras que ajudariam a começar.
