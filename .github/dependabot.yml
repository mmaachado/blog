version: 2

updates:
  # As actions do workflow de verificação.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"

  # O tema, que é um submodule. O upstream anda devagar, então mensal basta.
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
