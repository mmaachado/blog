<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"{{ with .Site.Language.Locale }} xml:lang="{{ . }}" lang="{{ . }}"{{ end }}>
<head>
    {{ partial "head/scripts.html" . }}

    <!-- Content Type -->
    <meta http-equiv="content-type" content="text/html; charset=utf-8">

    <!-- Enable responsiveness on mobile devices-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- favicon -->
    <link rel="icon" href={{ .Site.Params.favicon | default "/favicon.png" }}>

    <!-- META -->
    {{ partial "head/meta.html" . }}

    <!-- CSS stylesheets -->
    {{ partial "head/stylesheets.html" . }}

    <!-- Custom style tag for parameterized CSS -->
    {{ partial "head/css.html" . }}

    {{ if gt (len hugo.Sites) 1 }}
    <!-- Alternativas de idioma. Só saem quando há mais de um idioma
         configurado; com um idioma só, nada é emitido. -->
    {{ range .AllTranslations }}
    <link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
    {{ end }}
    {{ end }}

    {{ if .Site.Params.vercel_analytics }}
    <!-- Vercel Web Analytics: sem cookies e sem identificador de visitante.
         A rota só existe depois de habilitar Analytics no painel do projeto,
         e o caminho pode ser específico do projeto. -->
    <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
    <script defer src="{{ .Site.Params.vercel_analytics_script | default "/_vercel/insights/script.js" }}"></script>
    {{ end }}
</head>
